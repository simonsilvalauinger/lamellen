[package]
edition      = "2024"
name         = "lamellen-node"
rust-version = "1.95"
version      = "0.1.0"
description  = "Akku-Knoten am Lüftungsgitter: Servo + ESP-NOW + Deep-Sleep (XIAO ESP32-C6)"

[[bin]]
name = "lamellen-node"
path = "./src/main.rs"

[features]
# Schneckengetriebemotor (DRV8833) mit AS5600 statt Servo, siehe hardware/GITTER.md
schnecke = []

[dependencies]
lamellen-protocol = { path = "../protocol" }

esp-hal = { version = "~1.2.2", features = ["esp32c6", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32c6", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6", "log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp-alloc", "esp32c6", "log-04", "unstable", "esp-now"] }
esp-alloc = { version = "0.11.0", features = ["esp32c6"] }
esp-backtrace = { version = "0.20.0", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32c6", "log-04"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
log = "0.4.27"
nb = "1.1"

# Das Standardprofil ist auf dem Chip zu langsam und zu groß.
[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
